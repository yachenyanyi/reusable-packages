[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "website-collection-kit"
version = "0.1.0"
description = "可复用的网站结构探测与公开内容采集组件"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
http = [
  "httpx>=0.27,<1.0",
]
browser = [
  "playwright>=1.50,<2.0",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27,<1.0",
  "playwright>=1.50,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/website_collection_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

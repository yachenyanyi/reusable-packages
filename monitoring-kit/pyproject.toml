[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "monitoring-kit"
version = "0.1.0"
description = "可复用的外部信息可靠监测核心"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
monitoring-kit = "monitoring_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/monitoring_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
